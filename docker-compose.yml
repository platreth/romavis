services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: romavis
      POSTGRES_PASSWORD: romavis
      POSTGRES_DB: romavis
    ports:
      - "5433:5432"
    volumes:
      - romavis_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U romavis"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  romavis_pg:
